name: Build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run all six off-device suites
        run: ./tools/check.sh

  firmware:
    name: ESP32-S3 firmware (ESP-IDF 5.5.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build firmware from checked-in defaults
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
