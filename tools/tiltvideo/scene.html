<!doctype html>
<!--
  A 3D model of the board replaying a recorded autopilot run: the screen shows
  the game's own frames, and the board leans by the tilt the autopilot applied
  on each frame. Driven by render.mjs; see make.sh.
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#F4F1EA}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<canvas id="out" width="1080" height="1350"></canvas>
<script type="module">
import * as THREE from 'three';

const W = 1080, H = 1350;
const PAPER = 0xF4F1EA, INK = 0x1D1C19;

// ---- trace: what the autopilot's "hand" did on every frame -----------------
const csv = await (await fetch('work/trace.csv')).text();
const rows = csv.trim().split('\n');
const head = rows.shift().split(',');
const T = rows.map(r => Object.fromEntries(r.split(',').map((v, i) => [head[i], +v])));
const N = T.length;

// Hands lead the movement they cause, so smooth the tilt with a centred
// window rather than a lagging filter.
function smooth(key, sigma) {
  const out = new Float32Array(N), k = [];
  for (let d = -3 * sigma; d <= 3 * sigma; d++) k.push([d, Math.exp(-d * d / (2 * sigma * sigma))]);
  for (let i = 0; i < N; i++) {
    let s = 0, w = 0;
    for (const [d, kw] of k) { const j = Math.min(N - 1, Math.max(0, i + d)); s += T[j][key] * kw; w += kw; }
    out[i] = s / w;
  }
  return out;
}
const MX = smooth('mx', 4), MY = smooth('my', 4);

// Inverse of the game's tilt response: ~3 degree deadzone, ~29 at full tilt.
const DEG = Math.PI / 180;
function angle(t) {
  const a = Math.abs(t);
  return Math.sign(t) * (3.2 * Math.min(1, a / 0.08) + a * 25.7) * DEG;
}
// A hand is never perfectly still. Small enough to sit inside the deadzone.
function tremor(i, seed) {
  const t = i / 30;
  return (Math.sin(t * 1.7 + seed) * 0.22 + Math.sin(t * 3.9 + seed * 2.3) * 0.12 + Math.sin(t * 7.3 + seed * 5.1) * 0.05) * DEG;
}

// ---- renderer / scene ------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);

const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 200);
camera.position.set(0, 4.4, 20.5);
camera.lookAt(0, -0.95, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d2c4, 1.25));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-2.5, 14, 4.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
key.shadow.radius = 26;
key.shadow.blurSamples = 24;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0xfff4e6, 0.9);
rim.position.set(6, 3, -4);
scene.add(rim);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.13 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.7;
floor.receiveShadow = true;
scene.add(floor);

// ---- the board ----------------------------------------------------------------------
function rrect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function planeUV(geo, w, h) {
  const p = geo.attributes.position, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) { uv[2 * i] = (p.getX(i) + w / 2) / w; uv[2 * i + 1] = (p.getY(i) + h / 2) / h; }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return geo;
}

// Units are centimetres. The active area is the panel's real 28.7 x 35.0 mm.
const BW = 3.9, BH = 4.7, BD = 0.95, BEV = 0.14;
const SW = 2.87, SH = 3.50, SR = 0.41;

const tilt = new THREE.Group();          // what the hand rotates
const held = new THREE.Group();          // neutral: facing the camera, tipped back
held.rotation.x = -0.24;
held.position.y = 0.45;
held.add(tilt);
scene.add(held);

const bodyGeo = new THREE.ExtrudeGeometry(rrect(BW, BH, 0.78), {
  depth: BD, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV, bevelSegments: 8, curveSegments: 32,
});
bodyGeo.center();
const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: 0x22211e, roughness: 0.55, metalness: 0.05 }));
body.castShadow = true;
tilt.add(body);
const FRONT = BD / 2 + BEV;

// the panel glass, black where there are no pixels
const glass = new THREE.Mesh(new THREE.ShapeGeometry(rrect(SW + 0.34, SH + 0.34, SR + 0.17), 32),
  new THREE.MeshStandardMaterial({ color: 0x0b0b0a, roughness: 0.18, metalness: 0.0 }));
glass.position.z = FRONT + 0.002;
tilt.add(glass);

// the game, drawn into a canvas so a touch can be marked on it
const screenCanvas = document.createElement('canvas');
screenCanvas.width = 736; screenCanvas.height = 896;
const sctx = screenCanvas.getContext('2d');
const screenTex = new THREE.CanvasTexture(screenCanvas);
screenTex.colorSpace = THREE.SRGBColorSpace;
screenTex.anisotropy = 8;
const screen = new THREE.Mesh(planeUV(new THREE.ShapeGeometry(rrect(SW, SH, SR), 32), SW, SH),
  new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false }));
screen.position.z = FRONT + 0.004;
tilt.add(screen);

// a soft glint that slides across the glass as it tilts
const glintCanvas = document.createElement('canvas');
glintCanvas.width = glintCanvas.height = 512;
{
  const g = glintCanvas.getContext('2d');
  const grd = g.createLinearGradient(0, 512, 512, 0);
  grd.addColorStop(0.00, 'rgba(255,255,255,0)');
  grd.addColorStop(0.46, 'rgba(255,255,255,0)');
  grd.addColorStop(0.50, 'rgba(255,255,255,1)');
  grd.addColorStop(0.55, 'rgba(255,255,255,0)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
}
const glintTex = new THREE.CanvasTexture(glintCanvas);
glintTex.repeat.set(0.6, 0.6);
const glint = new THREE.Mesh(planeUV(new THREE.ShapeGeometry(rrect(SW + 0.34, SH + 0.34, SR + 0.17), 32), SW + 0.34, SH + 0.34),
  new THREE.MeshBasicMaterial({ map: glintTex, transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
glint.position.z = FRONT + 0.006;
tilt.add(glint);

// BOOT and PWR on the right side, USB-C on the bottom edge
const btnMat = new THREE.MeshStandardMaterial({ color: 0x2c2b27, roughness: 0.4 });
for (const y of [0.85, -0.15]) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.62, 0.34), btnMat);
  b.position.set(BW / 2 + BEV + 0.03, y, 0);
  b.castShadow = true;
  tilt.add(b);
}
const port = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.06, 0.3), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 }));
port.position.set(0, -BH / 2 - BEV - 0.005, 0);
tilt.add(port);

// ---- captions --------------------------------------------------------------------------
// [first frame, last frame, text]. Anchored to the trace: the route reveal,
// the first step, the first rescue, the first bomb, the first detection,
// the exit opening.
const firstEv = bit => T.findIndex(r => r.events & bit);
const revealAt = T.findIndex(r => r.reveal);
const moveAt = T.findIndex((r, i) => i > revealAt && (Math.abs(r.mx) + Math.abs(r.my)) > 0);
const lastRescue = T.map(r => r.rescued).lastIndexOf(Math.max(...T.map(r => r.rescued)));
const exitAt = T.findIndex(r => r.rescued === Math.max(...T.map(r => r.rescued)));
const clearAt = T.findIndex(r => r.phase === 5);
const wanted = [
  [revealAt, 'Hold to see every patrol route'],
  [moveAt, 'Tilt the board to move'],
  [firstEv(4), 'Free every hostage'],
  [firstEv(1), 'Tap to throw a sound bomb'],
  [firstEv(64), 'Stay out of their sight'],
  [exitAt, 'Then reach the exit'],
];
const CAPS = [];
let free = 0;
for (const [at, text] of wanted) {
  const s = Math.max(at, free);
  CAPS.push([s, s + 66, text]);
  free = s + 70;
}
CAPS.push([Math.max(clearAt + 22, free), N + 30, 'todd.sh/StealthGame']);

const out = document.getElementById('out');
const octx = out.getContext('2d');

function drawCaption(i) {
  for (const [a, b, text] of CAPS) {
    if (i < a || i > b) continue;
    const fade = Math.min(1, (i - a) / 8, (b - i) / 8);
    const lift = (1 - Math.min(1, (i - a) / 8)) * 10;
    octx.save();
    octx.globalAlpha = Math.max(0, fade);
    octx.fillStyle = '#1D1C19';
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    const url = text.startsWith('todd.sh');
    octx.font = url ? '400 46px Georgia, serif' : '700 30px Arial, Helvetica, sans-serif';
    if ('letterSpacing' in octx) octx.letterSpacing = url ? '0px' : '4px';
    octx.fillText(url ? text : text.toUpperCase(), W / 2, H - 150 + lift);
    octx.restore();
  }
}

// ---- touch marks ------------------------------------------------------------------------
let lastTouch = null, liftedAt = -1;

async function loadFrame(i) {
  const img = new Image();
  img.src = `work/frames/f${String(i + 1).padStart(5, '0')}.png`;
  await img.decode();
  return img;
}

window.renderFrame = async function (i) {
  const r = T[i];
  const img = await loadFrame(i);
  sctx.drawImage(img, 0, 0);

  if (r.finger) {
    if (!lastTouch || liftedAt >= 0) lastTouch = { x: r.fx * 2, y: r.fy * 2, down: i };
    liftedAt = -1;
  } else if (lastTouch && liftedAt < 0) {
    liftedAt = i;
  }
  if (lastTouch) {
    const held = liftedAt < 0 ? i - lastTouch.down : liftedAt - lastTouch.down;
    const since = liftedAt < 0 ? 0 : i - liftedAt;
    const a = liftedAt < 0 ? Math.min(1, held / 3) : Math.max(0, 1 - since / 10);
    if (a > 0) {
      const R = 34 + since * 4.5;
      sctx.save();
      sctx.globalAlpha = 0.30 * a;
      sctx.fillStyle = '#ffffff';
      sctx.beginPath(); sctx.arc(lastTouch.x, lastTouch.y, 30, 0, Math.PI * 2); sctx.fill();
      sctx.globalAlpha = 0.75 * a;
      sctx.strokeStyle = '#ffffff';
      sctx.lineWidth = 4;
      sctx.beginPath(); sctx.arc(lastTouch.x, lastTouch.y, R, 0, Math.PI * 2); sctx.stroke();
      sctx.restore();
    } else if (liftedAt >= 0) {
      lastTouch = null;
    }
  }
  screenTex.needsUpdate = true;

  const ax = angle(MX[i]) + tremor(i, 1.3);
  const ay = angle(MY[i]) + tremor(i, 4.1);
  tilt.rotation.set(ay, ax, tremor(i, 7.7) * 0.4, 'XYZ');
  glintTex.offset.set(0.2 - ax * 0.9, 0.2 + ay * 0.9);

  renderer.render(scene, camera);
  octx.clearRect(0, 0, W, H);
  octx.drawImage(renderer.domElement, 0, 0);
  drawCaption(i);
  return out.toDataURL('image/jpeg', 0.93);
};
window.frameCount = N;
window.captions = CAPS;
window.ready = true;
</script>
</body>
</html>
